<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>Smart Meter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Verdana, Geneva, Arial, sans-serif;
            font-size: 16px;
            margin: 8px;
        }

        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 2px 6px;
        }

        td {
            text-align: center;
        }

        canvas {
            width: 100%;
            height: 300px;
            border: 1px solid #888;
        }
    </style>
</head>

<body>
    <table style="width:100%">
        <tr>
            <td style="width: 50%">current power (W)</td>
            <td style="width: 50%"><span id="power">-</span></td>
        </tr>
        <tr>
            <td>peak, last 60 s (W)</td>
            <td><span id="peak">-</span></td>
        </tr>
        <tr>
            <td>L1 / L2 / L3 (W)</td>
            <td><span id="phases">-</span></td>
        </tr>
        <tr>
            <td>energy of selected day (kWh)</td>
            <td><span id="energy">-</span></td>
        </tr>
        <tr>
            <td>average / max. power (W)</td>
            <td><span id="stats">-</span></td>
        </tr>
        <tr>
            <td>dataset</td>
            <td><select id="dataset" onchange="loadDataset();"></select></td>
        </tr>
    </table>
    <br>
    <canvas id="chart"></canvas>
    <script>
        const COLORS = { power: "#000000", powerL1: "#1b9e77", powerL2: "#d95f02", powerL3: "#7570b3" };
        let rows = [];

        function fmt(x) {
            return Math.round(x).toString();
        }

        const recent = [];

        function showCurrent(d) {
            const net = d.power - d.powerProduction;
            const now = Date.now();
            recent.push([now, net]);
            while (recent[0][0] < now - 60000) recent.shift();
            document.getElementById("power").textContent = fmt(net);
            document.getElementById("peak").textContent = fmt(Math.max(...recent.map((r) => r[1])));
            document.getElementById("phases").textContent =
                [d.powerL1, d.powerL2, d.powerL3].map(fmt).join(" / ");
        }

        function connect() {
            const ws = new WebSocket("ws://" + window.location.host + "/ws/smart_meter");
            ws.onmessage = (event) => showCurrent(JSON.parse(event.data));
            ws.onclose = () => setTimeout(connect, 5000);
        }

        async function listDatasets() {
            const select = document.getElementById("dataset");
            const items = [];
            for (const archived of [false, true]) {
                const url = "/api/" + (archived ? "archived" : "available") + "_datasets?category=smartmeter";
                try {
                    const names = await (await fetch(url)).json();
                    names.forEach((name) => items.push({ name: name, archived: archived }));
                } catch (e) { }
            }
            items.sort((a, b) => b.name.split("_").pop().localeCompare(a.name.split("_").pop()));
            items.forEach((item) => {
                const option = document.createElement("option");
                option.value = JSON.stringify(item);
                option.textContent = item.name.split("_").slice(1).join(" ") + (item.archived ? " (archive)" : "");
                select.appendChild(option);
            });
            if (items.length) loadDataset();
        }

        async function loadDataset() {
            const item = JSON.parse(document.getElementById("dataset").value);
            const url = "/api/dataset/" + item.name + ".json" + (item.archived ? "?from_archive=true" : "");
            rows = await (await fetch(url)).json();
            updateStats();
            draw();
        }

        function updateStats() {
            if (!rows.length) return;
            // Net power: consumption minus production, 15 s per record.
            const net = rows.map((r) => r.power - (r.powerProduction || 0));
            const interval = 15;
            const kwh = net.reduce((a, b) => a + b, 0) * interval / 3600 / 1000;
            document.getElementById("energy").textContent = kwh.toFixed(2);
            document.getElementById("stats").textContent =
                fmt(net.reduce((a, b) => a + b, 0) / net.length) + " / " + fmt(Math.max(...net));
        }

        function draw() {
            const canvas = document.getElementById("chart");
            canvas.width = canvas.clientWidth * devicePixelRatio;
            canvas.height = canvas.clientHeight * devicePixelRatio;
            const ctx = canvas.getContext("2d");
            ctx.scale(devicePixelRatio, devicePixelRatio);
            const w = canvas.clientWidth, h = canvas.clientHeight;
            const left = 50, bottom = 22, top = 8, right = 8;
            ctx.clearRect(0, 0, w, h);
            if (!rows.length) return;
            const t0 = rows[0].utc, t1 = rows[rows.length - 1].utc;
            const ymax = Math.max(100, ...rows.map((r) => r.power)) * 1.05;
            const x = (t) => left + (t - t0) / Math.max(1, t1 - t0) * (w - left - right);
            const y = (v) => h - bottom - v / ymax * (h - bottom - top);
            ctx.font = "12px Verdana";
            ctx.fillStyle = "#444";
            ctx.strokeStyle = "#ddd";
            for (let i = 0; i <= 4; i++) {
                const v = ymax * i / 4;
                ctx.beginPath(); ctx.moveTo(left, y(v)); ctx.lineTo(w - right, y(v)); ctx.stroke();
                ctx.fillText(fmt(v), 4, y(v) + 4);
            }
            const step = Math.max(1, Math.ceil((t1 - t0) / 3600 / 8)) * 3600;
            for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
                const d = new Date(t * 1000);
                ctx.fillText(d.getHours().toString().padStart(2, "0") + ":00", x(t) - 14, h - 6);
            }
            for (const [key, color] of Object.entries(COLORS)) {
                ctx.strokeStyle = color;
                ctx.lineWidth = key === "power" ? 2 : 1;
                ctx.beginPath();
                rows.forEach((r, i) => {
                    // Break the line at data gaps.
                    const gap = i > 0 && r.utc - rows[i - 1].utc > 60;
                    if (i === 0 || gap) ctx.moveTo(x(r.utc), y(r[key]));
                    else ctx.lineTo(x(r.utc), y(r[key]));
                });
                ctx.stroke();
            }
        }

        window.addEventListener("resize", draw);
        connect();
        listDatasets();
    </script>
</body>

</html>
